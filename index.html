const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = 384, H = 448;

const bossImgs = { oko: new Image(), hyoe: new Image() };
bossImgs.oko.src = IMG_OKO;
bossImgs.hyoe.src = IMG_HYOE;
const logoImg = new Image();
logoImg.src = IMG_LOGO;
const playerImg = new Image();
playerImg.src = IMG_PLAYER;

// ボス（順番どおり：おこボン → ひょえボン）
const BOSSES = [
  { name: 'おこボン', img: 'oko', hp: [600, 800, 1000], spells: ['辛口・ひとくち地獄', '待ちぼうけ・限界突破', 'ゆずれない勝負'] },
  { name: 'ひょえボン', img: 'hyoe', hp: [500, 650, 800], spells: ['ぴょこっと・にげ足', 'かくれんぼ・ふるえる影', 'ちいさなおびえ・ぷるぷる'] }
];

const keys = {};
let state = 'title', frame = 0, bombType = 0, bombT = 0, bombKind = 0;
let stage = 0, spell = 0;
let P, boss, bullets, pShots, tsubo;

addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyZ') {
    if (state === 'title') start();
    else if (state === 'clear' || state === 'over') state = 'title';
  }
  if (e.code === 'KeyQ' && state === 'play') bombType = 1 - bombType;
  if (e.code === 'KeyX' && state === 'play') useBomb();
});
addEventListener('keyup', e => keys[e.code] = false);

function reset() {
  P = { x: W / 2, y: H - 60, lives: 5, bombs: 3, inv: 0 };
  boss = { x: W / 2, y: 110, t: 0, hp: 0, maxHp: 0 };
  bullets = []; pShots = []; tsubo = []; bombT = 0; frame = 0;
}
function start() { reset(); stage = 0; spell = 0; startSpell(); state = 'play'; }
function startSpell() {
  boss.t = 0;
  boss.maxHp = BOSSES[stage].hp[spell];
  boss.hp = boss.maxHp;
  bullets = []; pShots = [];
  P.inv = Math.max(P.inv, 60);
}
function eb(x, y, vx, vy, extra) { bullets.push(Object.assign({ x, y, vx, vy, r: 4, age: 0, bn: 0 }, extra || {})); }
function dist(a, b, c, d) { return Math.hypot(a - c, b - d); }
function clearNear(x, y, r) { bullets = bullets.filter(b => dist(b.x, b.y, x, y) > r); }
function hitBoss(n) {
  boss.hp -= n;
  if (boss.hp <= 0) {
    spell++;
    if (spell >= 3) {
      stage++; spell = 0;
      if (stage >= BOSSES.length) { state = 'clear'; return; }
    }
    startSpell();
  }
}
function useBomb() {
  if (P.bombs <= 0 || bombT > 0) return;
  P.bombs--;
  bombKind = bombType;
  bombT = bombKind === 0 ? 180 : 150;
}
function bulletVisible(b) { return !b.blink || (b.age % 60) < 30; }

// ボスの弾幕（仮）
function bossFire() {
  const t = boss.t, key = stage * 10 + spell;
  switch (key) {
    // おこボン：辛口・ひとくち地獄
    case 0:
      if (t % 12 === 0) {
        const a = Math.atan2(P.y - boss.y, P.x - boss.x) + (Math.random() - 0.5) * 0.2;
        eb(boss.x, boss.y, Math.cos(a) * 2.4, Math.sin(a) * 2.4);
      }
      if (t % 90 === 0) for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2; eb(boss.x, boss.y, Math.cos(a) * 1.8, Math.sin(a) * 1.8); }
      break;
    // おこボン：待ちぼうけ・限界突破
    case 1: {
      const every = Math.max(8, 36 - Math.floor(t / 120));
      if (t % every === 0) {
        const base = t * 0.03;
        for (let i = 0; i < 6; i++) { const a = base + i / 6 * Math.PI * 2; eb(boss.x, boss.y, Math.cos(a) * 1.6, Math.sin(a) * 1.6); }
      }
      break;
    }
    // おこボン：ゆずれない勝負
    case 2:
      if (t % 90 === 0) for (let k = 0; k < 12; k++) { eb(0, 40 + k * 30, 2.2, 0); eb(W, 40 + k * 30, -2.2, 0); }
      if (t % 25 === 0) { const a = Math.atan2(P.y - boss.y, P.x - boss.x); eb(boss.x, boss.y, Math.cos(a) * 3, Math.sin(a) * 3); }
      break;
    // ひょえボン：ぴょこっと・にげ足（壁で跳ね返る弾）
    case 10:
      if (t % 10 === 0) {
        const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 1.2;
        eb(boss.x, boss.y, Math.cos(a) * s, Math.sin(a) * s, { bn: 3 });
      }
      break;
    // ひょえボン：かくれんぼ・ふるえる影（出たり消えたりする弾）
    case 11:
      if (t % 45 === 0) for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2 + t * 0.05; eb(boss.x, boss.y, Math.cos(a) * 1.5, Math.sin(a) * 1.5, { blink: true }); }
      break;
    // ひょえボン：ちいさなおびえ・ぷるぷる（小さく震えながら落ちる弾）
    case 12:
      if (t % 6 === 0) eb(Math.random() * W, -5, (Math.random() - 0.5) * 1, 1.5 + Math.random(), { r: 2.5 });
      if (t % 120 === 0) for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; eb(boss.x, boss.y, Math.cos(a) * 1.2, Math.sin(a) * 1.2, { r: 3 }); }
      break;
  }
}

function update() {
  if (state !== 'play') return;
  frame++; boss.t++;
  const sp = (keys.ShiftLeft || keys.ShiftRight) ? 2 : 4;
  if (keys.ArrowLeft) P.x -= sp;
  if (keys.ArrowRight) P.x += sp;
  if (keys.ArrowUp) P.y -= sp;
  if (keys.ArrowDown) P.y += sp;
  if (touch.on) {
    const dx = touch.x - P.x, dy = touch.y - P.y, d = Math.hypot(dx, dy);
    if (d > 1) { const m = Math.min(d, 6); P.x += dx / d * m; P.y += dy / d * m; }
  }
  P.x = Math.max(10, Math.min(W - 10, P.x));
  P.y = Math.max(20, Math.min(H - 20, P.y));
  if (P.inv > 0) P.inv--;

  // さくしゃボンの通常弾：四方八方へ針を射出
  if ((keys.KeyZ || touch.on) && frame % 6 === 0) {
    for (const a of [-0.5, -0.25, 0, 0.25, 0.5]) pShots.push({ x: P.x, y: P.y - 8, vx: Math.sin(a) * 9, vy: -Math.cos(a) * 9, dmg: 2 });
    pShots.push({ x: P.x, y: P.y, vx: -6, vy: 0, dmg: 2 });
    pShots.push({ x: P.x, y: P.y, vx: 6, vy: 0, dmg: 2 });
  }

  if (BOSSES[stage].img === 'oko') {
    boss.x = W / 2 + Math.sin(boss.t * 0.01) * 120;
    boss.y = 110 + Math.sin(boss.t * 0.02) * 10;
  } else {
    boss.x = W / 2 + Math.sin(boss.t * 0.02) * 140;
    boss.y = 110 + Math.cos(boss.t * 0.03) * 16;
  }
  bossFire();

  // 術：ツボ連打（bombType 0）／蔦がらみ（bombType 1）
  if (bombT > 0) {
    bombT--;
    if (bombKind === 0) {
      if (bombT % 30 === 0) tsubo.push({ x: 30 + Math.random() * (W - 60), y: 60 + Math.random() * 220, t: 0 });
    } else {
      clearNear(P.x, P.y, 110);
      if (dist(boss.x, boss.y, P.x, P.y) < 150) hitBoss(1);
    }
  }
  for (const k of tsubo) {
    k.t++;
    clearNear(k.x, k.y, 40);
    if (k.t % 20 === 0) {
      const a = Math.atan2(boss.y - k.y, boss.x - k.x);
      pShots.push({ x: k.x, y: k.y, vx: Math.cos(a) * 6, vy: Math.sin(a) * 6, dmg: 15 });
    }
  }
  tsubo = tsubo.filter(k => k.t < 120);

  pShots.forEach(s => { s.x += s.vx; s.y += s.vy; });
  for (const s of pShots) {
    if (!s.dead && dist(s.x, s.y, boss.x, boss.y) < 36) { s.dead = true; hitBoss(s.dmg); }
    if (state !== 'play') break;
  }
  pShots = pShots.filter(s => !s.dead && s.x > -20 && s.x < W + 20 && s.y > -20 && s.y < H + 20);
  if (state !== 'play') return;

  bullets.forEach(b => {
    b.age++; b.x += b.vx; b.y += b.vy;
    if (b.bn > 0 && (b.x < 4 || b.x > W - 4)) { b.vx = -b.vx; b.bn--; b.x = Math.max(4, Math.min(W - 4, b.x)); }
  });
  bullets = bullets.filter(b => (b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20) || b.bn > 0);

  if (P.inv <= 0) {
    for (const b of bullets) {
      if (!bulletVisible(b)) continue;
      if (dist(b.x, b.y, P.x, P.y) < (b.r || 4) + 3) {
        P.lives--;
        P.inv = 150;
        bullets = [];
        P.x = W / 2; P.y = H - 60;
        if (P.lives <= 0) state = 'over';
        break;
      }
    }
  }
}

// ===== タッチ操作（スマホ）=====
const touch = { on: false, x: W / 2, y: H - 60 };
const BTN_BOMB = { x: 296, y: 392, w: 80, h: 44 };
const BTN_SWAP = { x: 206, y: 392, w: 80, h: 44 };
function inRect(p, r) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }
function toCanvas(t) {
  const r = cv.getBoundingClientRect();
  return { x: (t.clientX - r.left) * W / r.width, y: (t.clientY - r.top) * H / r.height };
}
cv.addEventListener('touchstart', e => {
  e.preventDefault();
  if (state === 'title') { start(); return; }
  if (state === 'clear' || state === 'over') { state = 'title'; return; }
  for (const t of e.changedTouches) {
    const p = toCanvas(t);
    if (inRect(p, BTN_BOMB)) useBomb();
    else if (inRect(p, BTN_SWAP)) bombType = 1 - bombType;
    else { touch.on = true; touch.x = p.x; touch.y = p.y; }
  }
}, { passive: false });
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  if (state !== 'play') return;
  const p = toCanvas(e.touches[0]);
  touch.x = p.x; touch.y = p.y;
}, { passive: false });
cv.addEventListener('touchend', e => {
  e.preventDefault();
  if (e.touches.length === 0) touch.on = false;
}, { passive: false });
cv.addEventListener('touchcancel', () => { touch.on = false; });

function drawTouchButtons() {
  for (const [r, label] of [[BTN_SWAP, bombType === 0 ? 'ツボ' : '蔦'], [BTN_BOMB, '術 ' + P.bombs]]) {
    g.fillStyle = 'rgba(58,40,24,0.25)';
    g.beginPath(); g.roundRect(r.x, r.y, r.w, r.h, 10); g.fill();
    g.fillStyle = '#3a2818';
    g.font = 'bold 14px sans-serif'; g.textAlign = 'center';
    g.fillText(label, r.x + r.w / 2, r.y + r.h / 2 + 5);
    g.textAlign = 'left';
  }
}

function drawBoss() {
  const im = bossImgs[BOSSES[stage].img];
  if (im.complete && im.naturalWidth) {
    const h = 120, w = h * im.naturalWidth / im.naturalHeight;
    g.drawImage(im, boss.x - w / 2, boss.y - h / 2 - 10, w, h);
  } else {
    g.fillStyle = '#e5484d';
    g.beginPath(); g.arc(boss.x, boss.y, 28, 0, Math.PI * 2); g.fill();
  }
}

function drawPlayer() {
  if (P.inv > 0 && Math.floor(P.inv / 4) % 2 === 0) return;
  if (playerImg.complete && playerImg.naturalWidth) {
    const h = 84, w = h * playerImg.naturalWidth / playerImg.naturalHeight;
    g.drawImage(playerImg, P.x - w / 2, P.y - h / 2, w, h);
  } else {
    g.fillStyle = '#b07a4a';
    g.beginPath(); g.arc(P.x, P.y, 6, 0, Math.PI * 2); g.fill();
  }
}

function draw() {
  g.clearRect(0, 0, W, H);
  if (state === 'title') return drawTitle();
  if (state === 'clear' || state === 'over') return drawEnd();

  if (bombT > 0 && bombKind === 1) {
    g.fillStyle = 'rgba(120,190,120,0.25)';
    g.beginPath(); g.arc(P.x, P.y, 110, 0, Math.PI * 2); g.fill();
  }
  for (const k of tsubo) {
    g.strokeStyle = '#7ec8a0'; g.lineWidth = 2;
    g.beginPath(); g.arc(k.x, k.y, 8, 0, Math.PI * 2); g.stroke();
  }
  drawBoss();
  drawPlayer();

  for (const b of bullets) {
    g.globalAlpha = bulletVisible(b) ? 1 : 0.25;
    g.fillStyle = '#ff6fa0';
    g.beginPath(); g.arc(b.x, b.y, b.r || 4, 0, Math.PI * 2); g.fill();
  }
  g.globalAlpha = 1;
  g.fillStyle = '#f5c542';
  for (const s of pShots) { g.beginPath(); g.arc(s.x, s.y, 2.5, 0, Math.PI * 2); g.fill(); }

  // HUD
  g.fillStyle = '#e5484d';
  g.fillRect(0, 0, W * boss.hp / boss.maxHp, 6);
  g.fillStyle = '#3a2818';
  g.font = 'bold 14px sans-serif';
  g.fillText(BOSSES[stage].name + '「' + BOSSES[stage].spells[spell] + '」', 8, 22);
  g.fillText('★'.repeat(P.lives), 8, H - 10);
  g.fillText('術 ' + P.bombs + '　' + (bombType === 0 ? 'ツボ連打' : '蔦がらみ'), 150, H - 10);
  g.font = '11px sans-serif';
  g.fillText('X:術　Q:術の切替　Shift:低速', 8, H - 28);
  drawTouchButtons();
}

function drawTitle() {
  g.fillStyle = '#3a2818';
  g.textAlign = 'center';
  if (logoImg.complete && logoImg.naturalWidth) g.drawImage(logoImg, (W - 352) / 2, 60 - 106 / 2, 352, 106);
  else { g.font = 'bold 30px sans-serif'; g.fillText('ぼんぼんばれっと', W / 2, 150); }
  g.font = '14px sans-serif';
  g.fillText('移動：矢印キー　ショット：Z 長押し', W / 2, 220);
  g.fillText('術：X　術の切替：Q　低速：Shift', W / 2, 244);
  g.font = 'bold 18px sans-serif';
  g.fillText('Z でスタート', W / 2, 320);
  g.textAlign = 'left';
}

function drawEnd() {
  g.fillStyle = '#3a2818';
  g.textAlign = 'center';
  g.font = 'bold 28px sans-serif';
  g.fillText(state === 'clear' ? 'クリア！' : 'ゲームオーバー', W / 2, 200);
  g.font = '16px sans-serif';
  g.fillText('Z でタイトルへ', W / 2, 250);
  g.textAlign = 'left';
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
